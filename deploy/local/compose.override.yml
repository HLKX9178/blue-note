# 本地端口覆盖，配合 podman-compose.yml 使用：
#   docker compose -f podman-compose.yml -f deploy/local/compose.override.yml up -d postgres nacos
#
# 原因：compose 里 Nacos 控制台默认占用宿主机 8080，与 hannote-auth 的 8080 冲突，
# 后启动的一方会 "Port is already allocated" 直接失败。这里把控制台挪到 18080，
# 8848/9848/9849 保持不变（服务注册与 gRPC 走这三个端口，不能改）。
services:
  nacos:
    ports: !override
      - "18080:8080"
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"

  # RocketMQ 镜像以 uid=3000(rocketmq) 运行，而 Docker 自动创建的命名卷属主是 root:root(755)，
  # 导致 broker 无法创建 store 目录 -> messageStore.load() 失败 -> initialize() 返回 false
  # -> 走 shutdown() -> NPE -> 退出码 255 -> 无限重启，日志卷里什么都没有。
  # 本地开发直接用 root 运行，避免每次 docker volume 重建后还要手工 chown。
  rocketmq-nameserver:
    user: root
  rocketmq-broker:
    user: root

