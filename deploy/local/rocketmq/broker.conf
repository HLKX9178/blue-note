brokerClusterName=BluenoteLocalCluster
brokerName=bluenote-broker
brokerId=0
namesrvAddr=rocketmq-nameserver:9876
listenPort=10911
# 本地联调必须显式指定对外广播地址。
# broker 默认会把容器内网 IP（如 172.18.0.x）注册到 nameserver，宿主机的 JVM
# 拿到这个地址后无法路由，报 connect to 172.x.x.x:10911 failed。
# 配合 compose 的 10911:10911 端口映射，改回 127.0.0.1 宿主机才连得上。
brokerIP1=127.0.0.1
deleteWhen=04
fileReservedTime=24
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
diskMaxUsedSpaceRatio=90
