server:
  port: 8000

spring:
  application:
    name: bluenote-gateway
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  cloud:
    gateway:
      server:
        webflux:
          # 路由规则：/auth/** 转发到认证服务，去掉首段前缀
          routes:
            - id: bluenote-auth
              uri: lb://bluenote-auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: bluenote-oss
              uri: lb://bluenote-oss
              predicates:
                - Path=/oss/**
              filters:
                - StripPrefix=1
            - id: bluenote-user
              uri: lb://bluenote-user
              predicates:
                - Path=/user/**
              filters:
                - StripPrefix=1
            - id: bluenote-note
              uri: lb://bluenote-note
              predicates:
                - Path=/note/**
              filters:
                - StripPrefix=1
            - id: bluenote-user-relation
              uri: lb://bluenote-user-relation
              predicates:
                - Path=/relation/**
              filters:
                - StripPrefix=1
            - id: bluenote-comment
              uri: lb://bluenote-comment
              predicates:
                - Path=/comment/**
              filters:
                - StripPrefix=1
      # 开启基于服务发现的动态路由（可选，按需保留）
      discovery:
        locator:
          enabled: false
